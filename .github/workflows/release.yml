name: Release (fallback)

# Releases are normally built on a Mac like the colleagues' and uploaded with
# scripts/release.sh. This workflow is the fallback when that Mac isn't around:
# start it by hand (Actions → Release (fallback) → Run workflow) for an existing tag.
# It builds Wolfgang.app + .dmg and creates a *draft* release; check it, then publish it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, e.g. v2.3.0"
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the app version
        run: |
          app=$(python3 -c "import json; print(json.load(open('crates/wolfgang-app/tauri.conf.json'))['version'])")
          if [ "v$app" != "${{ inputs.tag }}" ]; then
            echo "Tag ${{ inputs.tag }}, but tauri.conf.json says $app"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools (only needed to compile the codecs)
        run: brew install cmake nasm pkg-config autoconf automake libtool
      - uses: Swatinem/rust-cache@v2
      # Wolfgang's own ffmpeg takes ~10 minutes to build; it's rebuilt only when the script changes.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: ffmpeg (videos + audio)
        run: scripts/build-ffmpeg.sh
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        run: cargo test --workspace
      - name: Build app + dmg (+ signed update files)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          scripts/build-app.sh
          test -f target/release/bundle/macos/latest.json || { echo "Update-Dateien fehlen – Secrets gesetzt?"; exit 1; }
      - name: Release text
        run: sed "s/{{VERSION}}/${{ inputs.tag }}/" .github/release-body.md > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          # The app finds updates via releases/latest/download/latest.json,
          # so they reach colleagues only once this draft is published.
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Wolfgang.app.tar.gz
            target/release/bundle/macos/latest.json
          body_path: release-body.md
