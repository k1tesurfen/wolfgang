name: Release

# Push a tag like v2.0.0 → builds Wolfgang.app + .dmg and creates a *draft*
# GitHub release with the .dmg attached. Check it, then publish it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        run: |
          app=$(python3 -c "import json; print(json.load(open('crates/wolfgang-app/tauri.conf.json'))['version'])")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but tauri.conf.json says $app"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools (only needed to compile the codecs)
        run: brew install cmake nasm pkg-config autoconf automake libtool
      - uses: Swatinem/rust-cache@v2
      # Wolfgang's own ffmpeg takes ~10 minutes to build; it's rebuilt only when the script changes.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: ffmpeg (videos + audio)
        run: scripts/build-ffmpeg.sh
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Test
        run: cargo test --workspace
      - name: Build app + dmg (+ signed update files)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          scripts/build-app.sh
          test -f target/release/bundle/macos/latest.json || { echo "Update-Dateien fehlen – Secrets gesetzt?"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The app finds updates via releases/latest/download/latest.json,
          # so they reach colleagues only once this draft is published.
          files: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/Wolfgang.app.tar.gz
            target/release/bundle/macos/latest.json
          body: |
            **Wolfgang ${{ github.ref_name }}** für Macs mit Apple-Chip (macOS 13 oder neuer).

            1. `.dmg` öffnen und Wolfgang in den Programme-Ordner ziehen.
            2. Beim ersten Start: Wolfgang ist nicht von Apple beglaubigt. Siehe „Erster Start“ im README.
            3. Die Kommandozeile `wolfgang` installierst du in der App: auf Wolfgang klicken → „Installieren“.

            Wer schon Wolfgang 2.1 oder neuer hat, muss nichts tun: Wolfgang bietet die neue Version beim nächsten Start selbst an.
