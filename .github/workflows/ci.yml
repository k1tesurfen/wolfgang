name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    # Apple Silicon: Wolfgang decodes images with macOS ImageIO.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build tools (only needed to compile the codecs)
        run: brew install cmake nasm
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
