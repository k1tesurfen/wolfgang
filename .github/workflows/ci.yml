name: CI

# Only on main (everything lives there since 2026-11-09; v2 is retired), for pull
# requests, and by hand (Actions → CI → Run workflow). The tests also run locally
# before each commit, and scripts/release.sh won't release with a failing test.
# Skipped when a push only touches documentation, or with „[skip ci]“ in the
# commit message (built into GitHub).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/reference/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/reference/**", "LICENSE"]
  workflow_dispatch:

jobs:
  test:
    # Apple Silicon: Wolfgang decodes images with macOS ImageIO.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build tools (only needed to compile the codecs)
        run: brew install cmake nasm pkg-config autoconf automake libtool
      - uses: Swatinem/rust-cache@v2
      # Wolfgang's own ffmpeg takes ~10 minutes to build; it's rebuilt only when the script changes.
      - uses: actions/cache@v4
        with:
          path: target/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: ffmpeg (videos + audio)
        run: scripts/build-ffmpeg.sh
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
