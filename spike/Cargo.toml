[package]
name = "wolfgang-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"
mozjpeg = "0.10"
webp = "0.3"
ravif = "0.13"
rgb = "0.8"
png = "0.18"
fast_image_resize = "6"
hb-subset = { version = "0.3", features = ["bundled"] }
ttf2woff2 = { version = "0.14", default-features = false }

[profile.release]
lto = "thin"
