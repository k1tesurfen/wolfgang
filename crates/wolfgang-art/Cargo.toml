[package]
name = "wolfgang-art"
description = "Builds Wolfgang's pixel art: pixelizes reference images, renders sprite sources"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wolfgang-core = { path = "../wolfgang-core" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
