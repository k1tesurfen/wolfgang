[package]
name = "wolfgang-check"
description = "„Guck mal, die Seite“: a URL checked from the outside (DNS, redirects, every server address), shared by CLI and app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fastrand = "2"
# The same HTTP stack the app's updater already uses (rustls with ring, macOS's trust store).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
url = { version = "2", features = ["serde"] }
