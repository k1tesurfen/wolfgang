[package]
name = "wolfgang-dialogue"
description = "Wolfgang's conversation: a data-driven dialogue engine shared by CLI and app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wolfgang-core = { path = "../wolfgang-core" }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
