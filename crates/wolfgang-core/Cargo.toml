[package]
name = "wolfgang-core"
description = "Wolfgang's conversion engine: images and fonts, shared by CLI and app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
deunicode = "1"
dirs = "6"
fast_image_resize = "6"
flate2 = "1"
mozjpeg = "0.10"
png = "0.18"
ravif = "0.13"
rayon = "1"
rgb = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
read-fonts = "0.37"
skrifa = "0.40"
thiserror = "2"
walkdir = "2"
webp = "0.3"
libwebp-sys = "0.9"
woofwoof = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"

[dev-dependencies]
tempfile = "3"
