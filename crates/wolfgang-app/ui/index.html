<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolfgang</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="scene" width="320" height="180"></canvas>
  <div id="drop"></div>
  <div id="say" class="px bubble">
    <div id="say-text"></div>
    <div id="progress" hidden>
      <div id="bar"><div id="fill"></div></div>
      <div id="progress-label"></div>
    </div>
  </div>
  <div id="tail" class="px"></div>
  <div id="portrait" class="px" hidden><img id="face" alt=""></div>
  <div id="answers" class="px"></div>
  <div id="panel" class="px" hidden>
    <h2 id="panel-title"></h2>
    <div id="panel-body"></div>
    <div id="panel-close" class="btn">Fertig</div>
  </div>
  <div id="tip"></div>
</div>
<script src="sound.js"></script>
<script src="mock.js"></script>
<script src="app.js"></script>
</body>
</html>
