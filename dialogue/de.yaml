# Wolfgang spricht.
#
# Das hier ist das komplette Gespräch mit Wolfgang. CLI und App lesen beide diese
# Datei. Format und alle erlaubten Bedingungen/Platzhalter: siehe
# crates/wolfgang-dialogue/src/script.rs und context.rs.
#
# Dieselben Sätze gelten für Wolfgang, Ully und Burgunde. Wo der Name vorkommt,
# steht {name}; Sätze, deren Grammatik am Namen hängt („den neuen Wolfgang“),
# lieber so formulieren, dass sie für alle drei passen.
#
# Zum Ausprobieren ohne neu zu bauen:
#   WOLFGANG_DIALOGUE=dialogue/de.yaml wolfgang ~/Bilder
#
# Stil: gemütlich, per du, ein bisschen Umgangssprache. Kurze Sätze.
# Nie belehrend, nie hektisch. Wolfgang hat Kaffee und Zeit.

start: greet
after_run: done
after_cancel: stopped

idle:
  - "Leg mir einfach was auf den Tisch. Bilder, Videos, Musik, PDFs, Schriften … ich guck's mir an."
  - "Na? Was gibt's heute zu tun?"
  - "Kaffee ist da, Zeit hab ich auch. Her damit."
  - "Einfach rüberziehen und fallen lassen. Ich kümmer mich drum."
  - "Ruhiger Tag bisher. Hast du was für mich?"
  - "Wilma schläft schon wieder. Recht hat sie."
  - "Pssst, Wilma macht gerade Mittagsschlaf. Aber leg ruhig was hin."

working:
  - "Moment, bin dran …"
  - "Läuft. Ich setz mich dran."
  - "Pixel sortieren, Bytes rausschütteln … gleich fertig."
  - "Kurz noch. Der Kaffee ist eh noch heiß."
  - "Schön eins nach dem anderen."
  - "Jubdidubdidub. Was? Ja gleich fertig."
  - "Das hier hin und den da dran. So haben wir's bald."
  - "Läuft und läuft. Wie ein guter Film."
  - "Wilma passt auf, dass nix runterfällt."

nodes:
  # ── Ankommen ───────────────────────────────────────────────────────────────

  greet:
    mood: happy
    say:
      - [
          "Na, was hast du mir mitgebracht? Lass mal sehen …",
          "Moin! Zeig mal her, was du da hast.",
          "Ah, Arbeit. Schön. Mal gucken …",
        ]
      - when: [only_images]
        text:
          [
            "Ich seh {images:ein Foto:Fotos}.",
            "{images:Ein Foto:Fotos}, sehr schön.",
          ]
      - when: ["!only_images", "!nothing_to_do"]
        text: "Ich seh {pile_list}."
      - when: [media_tools_missing, "!nothing_to_do"]
        text: "Für Videos und Audio fehlt mir gerade mein Werkzeug, die lass ich liegen. Installier mich am besten nochmal neu."
      - when: [has_unknown, "!nothing_to_do"]
        text:
          [
            "Mit {unknown:einer Datei:Dateien} kann ich nix anfangen, die lass ich einfach liegen.",
            "{unknown:Eine Datei ist:Dateien sind} nicht mein Ding, die bleiben, wo sie sind.",
          ]
      - when: [has_duplicates]
        text: "{duplicates:Eine Datei ist:Dateien sind} doppelt drin. Mach ich nur einmal."
    go:
      - { when: [nothing_to_do], to: nothing }
      - { when: [has_known, "!has_new"], to: rerun_all_known }
      - { to: begin }

  begin:
    go:
      - { when: [nothing_to_ask], to: nothing_to_ask }
      - { when: [has_last_run], to: how }
      - { when: [has_presets], to: how }
      - { to: piles }

  nothing:
    mood: sorry
    say:
      - when: [media_tools_missing]
        text: "Videos und Audio würd ich ja machen, aber mir fehlt mein Werkzeug dafür. Installier mich am besten nochmal neu."
      - when: [has_unknown, "!media_tools_missing"]
        text: "Hm. Da ist nix bei, was ich umwandeln kann. Fotos, Videos, Musik, PDFs und Schriften, das ist mein Ding."
      - when: ["!has_unknown", "!media_tools_missing"]
        text: "Hm, da ist ja gar nix drin. Leer gefegt."
    answers:
      - { label: "Okay, schade", to: "@end" }

  # Schriften und PDFs brauchen keine Fragen.
  nothing_to_ask:
    say:
      - when: [has_fonts]
        text:
          [
            "Die Schriften mach ich dir zu WOFF2. Ganz ohne Rumschnippeln, alle Zeichen bleiben drin.",
            "Schriften? Easy. Gibt's als WOFF2, eins zu eins, nix wird weggelassen.",
          ]
      - when: [has_pdfs]
        text:
          [
            "Aus {pdfs:dem PDF:den PDFs} hol ich dir die Bilder raus, so wie sie drin sind.",
            "PDFs? Da fummel ich die Bilder raus. Eins zu eins, nix wird verändert.",
          ]
    go:
      - { to: rerun_check }

  # ── Wie letztes Mal? ───────────────────────────────────────────────────────

  how:
    mood: thinking
    say:
      - [
          "Wie machen wir's?",
          "Wie soll's werden?",
          "Und, wie hättest du's gern?",
        ]
    answers:
      - {
          label: "So wie letztes Mal ({last_run})",
          when: [has_last_run],
          set: { use_last: true },
          to: keywords,
        }
      - {
          label: "Vorlage „{preset}“",
          each: presets,
          set: { preset: "{preset}" },
          to: keywords,
        }
      - {
          label: "Lass uns das neu einstellen",
          set: { use_last: false },
          to: piles,
        }

  # ── Welcher Stapel ist dran? ───────────────────────────────────────────────
  # Erst die Fotos, dann Videos, dann Audio. Was eine Vorlage schon beantwortet
  # hat, wird übersprungen.

  piles:
    go:
      - { when: [has_images, "!images_asked"], to: mode }
      - { when: [has_videos, "!videos_asked"], to: videos }
      - { when: [has_audio, "!audio_asked"], to: audio }
      - { to: rerun_check }

  # ── Bilder: Modus ──────────────────────────────────────────────────────────

  mode:
    mood: thinking
    say:
      - ["Wofür brauchst du die Bilder?", "Was soll aus den Bildern werden?"]
    answers:
      - {
          label: "Fürs Web vorbereiten – klein und schnell",
          set: { mode: web, use_last: false },
          to: web_format,
        }
      - {
          label: "Hochwertig behalten – nur ein anderes Format",
          set: { mode: hq, use_last: false },
          to: hq_format,
        }

  hq_format:
    say:
      - "Alles klar: Originalgröße, volle Qualität. In welches Format?"
    answers:
      - {
          label: "JPG – passt überall",
          set: { hq.format: jpg },
          to: images_done,
        }
      - { label: "WebP", set: { hq.format: webp }, to: images_done }
      - {
          label: "AVIF – am kleinsten",
          set: { hq.format: avif },
          to: images_done,
        }
      - {
          label: "PNG – verlustfrei, auch mit Transparenz",
          set: { hq.format: png },
          to: images_done,
        }

  # ── Bilder: fürs Web ───────────────────────────────────────────────────────

  web_format:
    say:
      - "WebP oder AVIF? AVIF wird kleiner, dauert aber länger. WebP kann wirklich jeder Browser."
    answers:
      - { label: "WebP", set: { web.format: webp }, to: web_size }
      - { label: "AVIF", set: { web.format: avif }, to: web_size }

  web_size:
    say:
      - [
          "Wie groß sollen sie werden? Ich mein die längste Seite.",
          "Welche Größe? Gemeint ist die längste Seite.",
        ]
    answers:
      - {
          label: "Klein (800 px) – für Vorschaubilder",
          set: { web.max_side: 800 },
          to: web_quality,
        }
      - {
          label: "Normal (1600 px) – passt fast immer",
          set: { web.max_side: 1600 },
          to: web_quality,
        }
      - {
          label: "Groß (2400 px) – für große Titelbilder",
          set: { web.max_side: 2400 },
          to: web_quality,
        }
    input:
      kind: number
      min: 100
      max: 8000
      unit: px
      placeholder: "z. B. 1920"
      set: web.max_side
      to: web_quality
      invalid:
        - [
            "„{input}“? Gib mir einfach 'ne Zahl zwischen {min} und {max} Pixel.",
            "Da komm ich nicht mit. Irgendwas zwischen {min} und {max} Pixel, bitte.",
          ]

  web_quality:
    say:
      - "Und die Qualität? Weniger heißt kleinere Dateien."
    answers:
      - {
          label: "Kleiner (65) – reicht oft",
          set: { web.quality: 65 },
          to: prefix,
        }
      - {
          label: "Ausgewogen (80) – mein Tipp",
          set: { web.quality: 80 },
          to: prefix,
        }
      - {
          label: "Schöner (90) – für Fotos, die glänzen sollen",
          set: { web.quality: 90 },
          to: prefix,
        }
    input:
      kind: number
      min: 1
      max: 100
      placeholder: "1–100"
      set: web.quality
      to: prefix
      invalid:
        - "Qualität geht von {min} bis {max}. „{input}“ krieg ich da nicht unter."

  # ── Bilder: Namen ──────────────────────────────────────────────────────────

  prefix:
    say:
      - "Jetzt die Namen. Google mag sprechende Dateinamen."
      - "Soll vorne was davor? Der Kunde zum Beispiel, oder das Projekt."
    answers:
      - { label: "Nix davor", set: { naming.prefix: "" }, to: keywords }
    input:
      kind: text
      max_len: 40
      placeholder: "z. B. Hotel Seeblick"
      set: naming.prefix
      to: keywords
      invalid:
        - "Puh, das ist mir zu lang. Halt's kurz, so {max} Zeichen."

  keywords:
    go:
      - { when: ["!has_images"], to: piles }
      - { when: [mode_hq], to: images_done }
      # A template without photos: ask the photo questions after all.
      - { when: ["!mode_web"], to: piles }
      - { when: [keyword_files_found], to: keywords_found }
      - { when: [folders_without_keywords], to: keywords_ask }
      - { to: naming_style }

  keywords_found:
    say:
      - "Ich hab {keyword_folders:einen Stichwortzettel gefunden, den:Stichwortzettel gefunden, die} nehm ich für die Namen."
    set: { naming.use_keyword_files: true }
    go:
      - { when: [folders_without_keywords], to: keywords_ask }
      - { to: naming_style }

  keywords_ask:
    mood: thinking
    say:
      - when: [keyword_files_found]
        text: "Für {folders_without_keywords:einen Ordner:Ordner} hab ich aber keine Stichworte."
      - "Worum geht's auf den Bildern? Ein paar Stichworte machen die Dateinamen besser für Google."
    answers:
      - { label: "Für alle gleich", to: keywords_all }
      - {
          label: "Für jeden Ordner einzeln",
          when: [several_folders_without_keywords],
          to: keywords_folder,
        }
      - { label: "Ohne Stichworte", to: naming_style }

  keywords_all:
    say:
      - "Schreib's mir einfach hin. Zum Beispiel: Strand Sonnenuntergang Algarve"
    answers:
      - { label: "Doch lieber ohne", to: naming_style }
    input:
      kind: text
      max_len: 80
      placeholder: "z. B. Strand Sonnenuntergang Algarve"
      set: naming.keywords_all
      to: naming_style
      invalid:
        - "Das ist 'n Roman. Ein paar Stichworte reichen, höchstens {max} Zeichen."

  keywords_folder:
    foreach: folders_without_keywords
    then: naming_style
    say:
      - ["Und im Ordner „{folder}“?", "Was ist in „{folder}“ drauf?"]
    answers:
      - { label: "Den überspringen" }
    input:
      kind: text
      max_len: 80
      placeholder: "Stichworte"
      set: naming.folder_keywords
      invalid:
        - "Ein paar Stichworte reichen, höchstens {max} Zeichen."

  naming_style:
    go:
      - { when: [from_template], to: images_done }
      - { to: separator }

  separator:
    say:
      - "Wie sollen die Wörter getrennt sein?"
    answers:
      - {
          label: "Mit Bindestrich: {preview_dash}",
          set: { naming.separator: dash },
          to: append_original,
        }
      - {
          label: "Mit Unterstrich: {preview_underscore}",
          set: { naming.separator: underscore },
          to: append_original,
        }
      - {
          label: "Zusammen, groß geschrieben: {preview_caps}",
          set: { naming.separator: caps },
          to: append_original,
        }

  append_original:
    say:
      - "Soll der alte Dateiname mit rein? Hilft, wenn du später was wiederfinden willst."
    answers:
      - {
          label: "Nee, lass mal",
          set: { naming.append_original: false },
          to: images_done,
        }
      - {
          label: "Ja, mit rein",
          set: { naming.append_original: true },
          to: images_done,
        }

  images_done:
    set: { images.asked: true }
    go:
      - { to: piles }

  # ── Videos ─────────────────────────────────────────────────────────────────
  # Videos gibt's immer nur fürs Web. Namen: der Originalname, websicher.

  videos:
    say:
      - when: [several_piles, images_asked]
        text: ["Jetzt noch {videos:ein Video:Videos}.", "So, und dann {videos:ein Video:Videos}."]
      - when: [has_gifs]
        text: "Die animierten GIFs mach ich zu Videos – die werden viel kleiner und sehen genauso aus."
    go:
      - { to: video_format }

  video_format:
    mood: thinking
    say:
      - "MP4 oder WebM? MP4 läuft wirklich überall. WebM wird kleiner, aber ich brauch länger dafür."
    answers:
      - {
          label: "MP4 – läuft überall",
          set: { video.format: mp4 },
          to: video_size,
        }
      - {
          label: "WebM – kleiner, dauert aber länger",
          set: { video.format: webm },
          to: video_size,
        }
      # Aufschreiben ist immer die letzte Antwort (Besprechungen, siehe unten).
      - {
          label: "Nur aufschreiben, was gesagt wird",
          when: [transcription_installed],
          set: { video.format: transcript },
          to: transcript,
        }
      - {
          label: "Nur aufschreiben – muss ich erst installieren",
          when: ["!transcription_installed", "!transcript_explained"],
          to: transcript_missing,
        }

  video_size:
    say:
      - [
          "Wie groß soll's werden?",
          "Welche Größe? 1080p ist das, was man als Full HD kennt.",
        ]
    answers:
      - {
          label: "Klein (720p) – für Hintergrund- und Loop-Videos",
          set: { video.size: 720 },
          to: video_quality,
        }
      - {
          label: "Normal (1080p) – passt fast immer",
          set: { video.size: 1080 },
          to: video_quality,
        }
      - {
          label: "Originalgröße – so groß, wie's ist",
          set: { video.size: original },
          to: video_quality,
        }
    input:
      kind: number
      min: 144
      max: 4320
      unit: p
      placeholder: "z. B. 540"
      set: video.size
      to: video_quality
      invalid:
        - [
            "„{input}“? Gib mir 'ne Zahl zwischen {min} und {max}, zum Beispiel 540.",
            "Da komm ich nicht mit. Irgendwas zwischen {min} und {max}, bitte.",
          ]

  video_quality:
    say:
      - "Und die Qualität? Weniger heißt kleinere Dateien."
    answers:
      - {
          label: "Kleiner – reicht oft",
          set: { video.quality: smaller },
          to: video_sound_check,
        }
      - {
          label: "Ausgewogen – mein Tipp",
          set: { video.quality: balanced },
          to: video_sound_check,
        }
      - {
          label: "Schöner – wenn's glänzen soll",
          set: { video.quality: nicer },
          to: video_sound_check,
        }

  video_sound_check:
    go:
      - { when: [videos_have_sound], to: video_sound }
      - { to: video_background_check }

  video_sound:
    say:
      - ["Ton behalten?", "Und der Ton? Bleibt der drin?"]
    answers:
      - { label: "Mit Ton", set: { video.sound: true }, to: video_background_check }
      - {
          label: "Ohne Ton – für Hintergrund- und Loop-Videos",
          set: { video.sound: false },
          to: video_background_check,
        }

  video_background_check:
    go:
      - { when: [transparent_gifs], to: video_background }
      - { to: video_poster }

  video_background:
    mood: thinking
    say:
      - "Ein paar GIFs haben durchsichtige Stellen. Das kann MP4 nicht – was soll da hin?"
    answers:
      - { label: "Weiß", set: { video.background: white }, to: video_poster }
      - { label: "Schwarz", set: { video.background: black }, to: video_poster }

  video_poster:
    say:
      - "Soll ich dir {videos:ein Vorschaubild:Vorschaubilder} mitmachen? Das zeigt die Webseite, bis das Video läuft."
    answers:
      - { label: "Ja, gern", set: { video.poster: true }, to: videos_done }
      - {
          label: "Nee, brauch ich nicht",
          set: { video.poster: false },
          to: videos_done,
        }

  videos_done:
    set: { video.asked: true }
    go:
      - { to: piles }

  # ── Audio ──────────────────────────────────────────────────────────────────

  audio:
    say:
      - when: [several_piles, images_asked]
        text: "Jetzt noch {audio_files:eine Audiodatei:Audiodateien}."
      - when: [several_piles, "!images_asked", videos_asked]
        text: "Jetzt noch {audio_files:eine Audiodatei:Audiodateien}."
    go:
      - { to: audio_format }

  audio_format:
    mood: thinking
    say:
      - "MP3 oder AAC? MP3 läuft überall. AAC klingt bei gleicher Größe ein bisschen besser."
    answers:
      - {
          label: "MP3 – läuft überall",
          set: { audio.format: mp3 },
          to: audio_content,
        }
      - {
          label: "AAC (.m4a) – klingt bei gleicher Größe besser",
          set: { audio.format: aac },
          to: audio_content,
        }
      - {
          label: "Nur aufschreiben, was gesagt wird",
          when: [transcription_installed],
          set: { audio.format: transcript },
          to: transcript,
        }
      - {
          label: "Nur aufschreiben – muss ich erst installieren",
          when: ["!transcription_installed", "!transcript_explained"],
          to: transcript_missing,
        }

  audio_content:
    mood: thinking
    say:
      - ["Was ist drauf?", "Und was hört man da?"]
    answers:
      - {
          label: "Sprache – Podcast, Interview",
          set: { audio.content: speech },
          to: audio_done,
        }
      - { label: "Musik", set: { audio.content: music }, to: audio_done }
      - {
          label: "Musik, beste Qualität",
          set: { audio.content: best },
          to: audio_done,
        }

  audio_done:
    set: { audio.asked: true }
    go:
      - { to: piles }

  # ── Aufschreiben ───────────────────────────────────────────────────────────
  # Für Besprechungen: statt umzuwandeln schreibt Wolfgang auf, was gesagt wird
  # (eine .txt pro Aufnahme). Gilt für den ganzen Stapel (alle Videos bzw. alle
  # Audiodateien). Dafür braucht er ein Zusatzmodul aus den Einstellungen.

  transcript_missing:
    mood: sorry
    set: { transcript.explained: true }
    say:
      - "Fürs Aufschreiben brauch ich noch ein Zusatzmodul, so 575 MB. Das installierst du einmal in den Einstellungen – klick einfach auf meinen Computer."
      - "Diesmal also ganz normal:"
    go:
      - { when: [has_videos, "!videos_asked"], to: video_format }
      - { to: audio_format }

  transcript:
    go:
      - { when: [transcript_asked], to: transcript_done }
      - { to: transcript_timestamps }

  transcript_timestamps:
    mood: thinking
    say:
      - "Mit Zeitangaben? Dann steht vor jedem Absatz, wann's gesagt wurde – so findest du die Stelle in der Aufnahme wieder."
    answers:
      - {
          label: "Mit Zeitangaben",
          set: { transcript.timestamps: true },
          to: transcript_done,
        }
      - {
          label: "Ohne – nur der Text",
          set: { transcript.timestamps: false },
          to: transcript_done,
        }

  transcript_done:
    set: { transcript.asked: true }
    go:
      - { when: [has_videos, "!videos_asked"], to: videos_done }
      - { to: audio_done }

  # ── Schon mal gemacht? ─────────────────────────────────────────────────────

  rerun_check:
    go:
      - { when: [has_known, has_new], to: rerun }
      - { when: [has_known, "!rerun_all"], to: rerun_all_known }
      - { to: confirm }

  rerun:
    mood: surprised
    say:
      - "Moment, die kenn ich doch! {known_files:Eine Datei hab ich:Dateien hab ich} schon mal gemacht, {new_files:eine ist neu:sind neu}."
    answers:
      - { label: "Nur die neuen", set: { rerun: only_new }, to: confirm }
      - { label: "Alles nochmal", set: { rerun: all }, to: confirm }

  rerun_all_known:
    mood: surprised
    say:
      - "Die hab ich alle schon mal gemacht. Liegen in „{output_folder}“."
    answers:
      - { label: "Trotzdem nochmal", set: { rerun: all }, to: begin }
      - { label: "Ach so, dann passt's", to: cancelled }

  # ── Los? ───────────────────────────────────────────────────────────────────

  confirm:
    mood: happy
    say:
      - "{summary}"
      - when: [takes_a_while]
        text:
          [
            "Das dauert {estimate}. Zeit für 'nen Kaffee.",
            "Das braucht {estimate}. Ich hab Geduld – du auch?",
          ]
      - ["Passt das so?", "Soll ich?", "Einverstanden?"]
    answers:
      - { label: "Los geht's!", to: "@start" }
      - {
          label: "Nochmal ändern",
          when: [has_media],
          set: { restart: true },
          to: piles,
        }
      - { label: "Lass mal, doch nicht", to: cancelled }

  cancelled:
    mood: neutral
    say:
      - [
          "Kein Ding. Wenn du's dir anders überlegst, ich bin hier.",
          "Alles klar, dann nicht. Ich lauf ja nicht weg.",
        ]
    go:
      - { to: "@cancel" }

  # ── Nach getaner Arbeit ────────────────────────────────────────────────────

  done:
    mood: proud
    say:
      - when: ["!failed_any", saved_bytes]
        text:
          [
            "Fertig! {converted:Eine Datei:Dateien} in {duration}, aus {bytes_in} sind {bytes_out} geworden.",
            "So, erledigt. {bytes_in} rein, {bytes_out} raus – {saved_percent} Prozent gespart.",
          ]
      - when: ["!failed_any", "!saved_bytes"]
        text: ["Fertig! Hat {duration} gedauert.", "So, erledigt."]
      - when: [pictures_from_pdfs]
        text: "Aus {pdfs:dem PDF:den PDFs} hab ich {pdf_pictures:ein Bild:Bilder} rausgeholt."
      - when: [wrote_transcripts]
        text: "{transcripts:Eine Aufnahme hab ich:Aufnahmen hab ich} aufgeschrieben. Namen und Fachwörter schreib ich nach Gehör – lies da lieber nochmal drüber."
      - when: [failed_any, "!all_failed"]
        text: "{converted:Eine Datei hat:Dateien haben} geklappt, aber bei {failed:einer:} hat's gehakt. Zum Beispiel: {first_error}"
      - when: [all_failed]
        text: "Mist, da hat gar nix geklappt. {first_error}"
      - when: [has_notes]
        text: "Bei manchen Schriften war ich extra vorsichtig. Die sind dafür ein kleines bisschen größer."
      - when: [videos_kept_original]
        text: "{videos_kept_original:Ein Video war:Videos waren} schon richtig gut gepackt. Da hab ich das Original genommen und nur aufgeräumt."
      - when: [videos_grew]
        text: "{videos_grew:Ein Video ist:Videos sind} etwas größer geworden als vorher – {videos_grew:war:waren} wohl schon gut gepackt."
      - when: [pdfs_without_pictures]
        text: "In {pdfs_without_pictures:einem PDF:PDFs} war gar kein Bild drin."
      - when: [pdfs_unreadable]
        text: "Ein paar Bilder in den PDFs konnte ich nicht lesen, zum Beispiel eingescannte Fax-Seiten."
      - when: [has_gifs, converted_any]
        text: "Die GIFs sind jetzt Videos. Damit sie auf der Webseite wie GIFs laufen, brauchen sie autoplay, muted, loop und playsinline."
      - when: [converted_any]
        text: "Liegt alles in „{output_folder}“."
    answers:
      - {
          label: "Als Vorlage merken",
          when: [has_media, "!from_template", converted_any],
          to: preset_name,
        }
      - { label: "Danke, {name}!", to: bye }

  bye:
    mood: happy
    say:
      - ["Gern geschehen!", "Immer wieder gern.", "Dafür nicht. Bis zum nächsten Stapel!"]
    go:
      - { to: "@end" }

  preset_name:
    say:
      - "Wie soll die Vorlage heißen? Dann biet ich sie dir nächstes Mal gleich an."
    answers:
      - { label: "Doch nicht", to: "@end" }
    input:
      kind: text
      max_len: 40
      placeholder: "z. B. Blog-Bilder"
      set: save_preset
      to: preset_saved
      invalid:
        - "Kürzer bitte, so {max} Zeichen."

  preset_saved:
    mood: happy
    say:
      - "Gemerkt! „{save_preset_name}“ steht jetzt in meinem Notizbuch."
    go:
      - { to: "@end" }

  stopped:
    mood: sorry
    say:
      - "Okay, hab aufgehört."
      - when: [converted_any]
        text: "{converted:Eine Datei ist:Dateien sind} trotzdem schon fertig, die liegen in „{output_folder}“."
    answers:
      - { label: "Alles klar", to: "@end" }
